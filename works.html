<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 작품 소개</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
            background: -webkit-linear-gradient(#4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #ccc;
            margin-bottom: 30px;
        }

        .works-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .work-card {
            background: rgba(0, 0, 0, 0.25);
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid #a18cd1;
            transition: all 0.3s ease;
        }

        .work-card:nth-child(2) {
            border-left-color: #fbc2eb;
        }

        .work-card:hover {
            transform: translateX(5px) scale(1.02);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .work-info {
            text-align: left;
        }

        .work-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .work-desc {
            font-size: 13px;
            color: #aaa;
        }

        .play-icon {
            font-size: 24px;
        }

        .back-btn {
            margin-top: 30px;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>나의 작품 갤러리</h1>
        <p>제가 지금까지 만든 게임들을 소개합니다!</p>

        <div class="works-grid">
            <a href="pages/game.html" class="work-card">
                <div class="work-info">
                    <div class="work-title">곤충 전쟁 (Insect War) 🐛</div>
                    <div class="work-desc">다양한 곤충을 소환하여 보스를 물리쳐보세요!</div>
                </div>
                <div class="play-icon">▶️</div>
            </a>

            <a href="pages/halligalli.html" class="work-card">
                <div class="work-info">
                    <div class="work-title">할리갈리 🔔</div>
                    <div class="work-desc">같은 과일 5개가 모이면 종을 치는 스릴 넘치는 게임!</div>
                </div>
                <div class="play-icon">▶️</div>
            </a>
        </div>

        <button class="back-btn" onclick="window.location.href='index.html'">뒤로 가기</button>
    </div>

</body>
</html>
