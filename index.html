<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀 프로필</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 공통 글래스모피즘 스타일 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        /* Password Screen */
        #password-screen {
            padding: 40px 50px;
            border-radius: 24px;
            text-align: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: absolute;
            z-index: 10;
        }

        #password-screen h2 {
            margin: 0 0 15px;
            font-weight: 700;
            font-size: 24px;
            color: #4facfe;
            letter-spacing: 1px;
        }

        #password-screen p {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }

        input[type="password"] {
            padding: 15px;
            width: 200px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
            margin-bottom: 25px;
            outline: none;
            text-align: center;
            letter-spacing: 8px;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            border-color: #4facfe;
            background: rgba(255, 255, 255, 0.15);
        }

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        #error-msg {
            color: #ff5252;
            margin-top: 15px;
            font-size: 13px;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-5px);
            }

            40%,
            80% {
                transform: translateX(5px);
            }
        }

        /* Profile Screen */
        #profile-screen {
            display: none;
            /* 초기에는 숨김 */
            padding: 50px 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 350px;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .profile-image-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 25px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .profile-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #1e1e1e;
        }

        #profile-screen h1 {
            margin: 0 0 10px;
            font-size: 26px;
            font-weight: 700;
            background: -webkit-linear-gradient(#fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #profile-screen p.bio {
            color: #aaa;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .info-grid {
            display: grid;
            gap: 15px;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 15px 20px;
            border-radius: 16px;
            text-align: left;
            border-left: 4px solid #4facfe;
            transition: transform 0.2s ease;
        }

        .info-box:hover {
            transform: translateX(5px);
            background: rgba(0, 0, 0, 0.35);
        }

        .info-box span.label {
            display: block;
            font-size: 11px;
            color: #4facfe;
            margin-bottom: 5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-box span.value {
            font-size: 16px;
            color: #fff;
            font-weight: 400;
        }

        .game-images {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .game-img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease;
        }

        .game-img:hover {
            transform: scale(1.1);
        }

        .works-btn {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(161, 140, 209, 0.4);
        }

        .works-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(161, 140, 209, 0.6);
        }

        .works-btn:active {
            transform: translateY(1px);
        }

        .study-btn {
            margin-top: 15px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(67, 233, 123, 0.4);
        }

        .study-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 233, 123, 0.6);
        }

        .study-btn:active {
            transform: translateY(1px);
        }

        /* Jumpscare Screen */
        #jumpscare-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .jumpscare-img {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            animation: flash 0.1s infinite;
        }

        @keyframes flash {

            0%,
            100% {
                opacity: 1;
                filter: invert(0%);
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                filter: invert(100%);
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>

    <!-- 깜놀 화면 -->
    <div id="jumpscare-screen">
        <img src="깜놀주의.png" alt="깜놀" class="jumpscare-img"
            onerror="this.src='https://via.placeholder.com/800x600/ff0000/ffffff?text=JUMPSCARE'">
    </div>

    <!-- 자물쇠 화면 -->
    <div id="password-screen" class="glass-panel">
        <h2>🔒 PRIVATE PROFILE</h2>
        <p>개인정보를 확인하려면<br>비밀번호를 입력해주세요.</p>
        <input type="password" id="pwd-input" placeholder="****" onkeypress="handleKeyPress(event)" maxlength="8">
        <br>
        <button onclick="checkPassword()">잠금 해제</button>
        <div id="error-msg">비밀번호가 일치하지 않습니다.</div>
    </div>

    <!-- 프로필 상세 화면 -->
    <div id="profile-screen" class="glass-panel">
        <div class="profile-image-container">
            <!-- 사용자님이 업로드하신 사진의 파일명을 image.png 또는 image.jpg 등으로 변경하여 아래 src에 넣어주세요 -->
            <!-- 현재는 기본적으로 보여지도록 설정되어 있습니다 -->
            <img src="profile.png" alt="내 프로필 이미지" class="profile-image" id="user-image"
                onerror="this.src='https://via.placeholder.com/150/2d2d2d/4facfe?text=Image'">
        </div>
        <h1>안녕하세요!</h1>
        <p class="bio">이곳은 저를 소개하는 프라이빗 프로필 공간입니다. 방문해주셔서 감사합니다.</p>

        <div class="info-grid">
            <div class="info-box">
                <span class="label">이름</span>
                <span class="value">환희</span>
            </div>

            <div class="info-box">
                <span class="label">특징</span>
                <span class="value">엽기적이다</span>
            </div>

            <div class="info-box">
                <span class="label">연락처</span>
                <span class="value">비공개</span>
            </div>

            <div class="info-box">
                <span class="label">좋아하는 게임</span>
                <div class="game-images">
                    <img src="로블.png" alt="로블록스" class="game-img">
                    <img src="다운로드.png" alt="다운로드게임" class="game-img">
                </div>
            </div>
        </div>
        <button class="works-btn" onclick="window.location.href='works.html'">내가 만든 작품 보러가기 🎮</button>
        <button class="study-btn" onclick="window.location.href='study.html'">그외 공부한 것들 📚</button>
    </div>

    <script>
        function checkPassword() {
            const input = document.getElementById('pwd-input').value;
            const errorMsg = document.getElementById('error-msg');
            const pwdScreen = document.getElementById('password-screen');
            const profileScreen = document.getElementById('profile-screen');

            if (input === '6974') {
                // 비번 맞춤 -> 깜놀 액션 시작
                pwdScreen.style.display = 'none';
                errorMsg.style.display = 'none';

                const jumpscare = document.getElementById('jumpscare-screen');
                jumpscare.style.display = 'flex';

                // 깜놀 오디오 재생 (aa.mp3 파일 필요)
                try {
                    const audio = new Audio('aa.mp3');
                    audio.play();
                } catch (e) {
                    console.error('오디오 재생 실패:', e);
                }

                // 3.75초 뒤에 깜놀 화면 없애고 프로필 보여주기
                setTimeout(() => {
                    jumpscare.style.display = 'none';
                    profileScreen.style.display = 'block';

                    setTimeout(() => {
                        profileScreen.style.opacity = '1';
                        profileScreen.style.transform = 'translateY(0)';
                    }, 50);
                }, 3750);
            } else {
                // 실패 시 애니메이션
                errorMsg.style.display = 'block';

                // 애니메이션 리셋 트릭
                errorMsg.style.animation = 'none';
                errorMsg.offsetHeight; /* trigger reflow */
                errorMsg.style.animation = 'shake 0.4s ease-in-out';

                document.getElementById('pwd-input').value = '';
                document.getElementById('pwd-input').focus();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        }

        // 페이지 로드 시 인풋란 포커스
        window.onload = () => {
            document.getElementById('pwd-input').focus();
        }
    </script>
</body>

</html>
