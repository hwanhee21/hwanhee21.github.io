<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀 프로필</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 공통 글래스모피즘 스타일 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        /* Password Screen */
        #password-screen {
            padding: 40px 50px;
            border-radius: 24px;
            text-align: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: absolute;
            z-index: 10;
        }

        #password-screen h2 {
            margin: 0 0 15px;
            font-weight: 700;
            font-size: 24px;
            color: #4facfe;
            letter-spacing: 1px;
        }

        #password-screen p {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }

        input[type="password"] {
            padding: 15px;
            width: 200px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
            margin-bottom: 25px;
            outline: none;
            text-align: center;
            letter-spacing: 8px;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            border-color: #4facfe;
            background: rgba(255, 255, 255, 0.15);
        }

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        #error-msg {
            color: #ff5252;
            margin-top: 15px;
            font-size: 13px;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-5px);
            }

            40%,
            80% {
                transform: translateX(5px);
            }
        }

        /* Profile Screen */
        #profile-screen {
            display: none;
            /* 초기에는 숨김 */
            padding: 50px 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 350px;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .profile-image-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 25px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #1e1e1e;
            box-sizing: border-box;
        }

        #scratch-canvas {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            cursor: crosshair;
            z-index: 2;
        }

        #profile-screen h1 {
            margin: 0 0 10px;
            font-size: 26px;
            font-weight: 700;
            background: -webkit-linear-gradient(#fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #profile-screen p.bio {
            color: #aaa;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .info-grid {
            display: grid;
            gap: 15px;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 15px 20px;
            border-radius: 16px;
            text-align: left;
            border-left: 4px solid #4facfe;
            transition: transform 0.2s ease;
        }

        .info-box:hover {
            transform: translateX(5px);
            background: rgba(0, 0, 0, 0.35);
        }

        .info-box span.label {
            display: block;
            font-size: 11px;
            color: #4facfe;
            margin-bottom: 5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-box span.value {
            font-size: 16px;
            color: #fff;
            font-weight: 400;
        }

        .game-images {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .game-img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease;
        }

        .game-img:hover {
            transform: scale(1.1);
        }

        .works-btn {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(161, 140, 209, 0.4);
        }

        .works-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(161, 140, 209, 0.6);
        }

        .works-btn:active {
            transform: translateY(1px);
        }

        .study-btn {
            margin-top: 15px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(67, 233, 123, 0.4);
        }

        .study-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 233, 123, 0.6);
        }

        .study-btn:active {
            transform: translateY(1px);
        }

        /* Jumpscare Screen */
        #jumpscare-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .jumpscare-img {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            animation: flash 0.1s infinite;
        }

        @keyframes flash {

            0%,
            100% {
                opacity: 1;
                filter: invert(0%);
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                filter: invert(100%);
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>

    <!-- 함정카드 화면 -->
    <div id="trap-screen" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.95); z-index:9999; flex-direction:column; justify-content:center; align-items:center; color:white; text-align:center;">
        <h1 id="trap-title" style="font-size: 50px; color: #ff0000; text-shadow: 0 0 20px #ff0000; animation: shake 0.5s infinite; margin-bottom: 30px;">함정카드 발동!</h1>
        <div id="quiz-container" style="display:none; background: rgba(255,255,255,0.1); padding: 30px; border-radius: 15px; width: 80%; max-width: 400px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h2 id="quiz-progress" style="margin-top:0; color:#4facfe; font-size: 18px;">질문 1 / 15</h2>
            <p id="quiz-question" style="font-size: 20px; margin: 20px 0; font-weight: bold;">질문 내용</p>
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 25px;">
                <button id="quiz-btn-yes" style="padding: 12px 30px; border:none; border-radius: 8px; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color:white; font-size:16px; font-weight:bold; cursor:pointer; flex: 1; box-shadow: 0 4px 15px rgba(79,172,254,0.4);">예</button>
                <button id="quiz-btn-no" style="padding: 12px 30px; border:none; border-radius: 8px; background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); color:white; font-size:16px; font-weight:bold; cursor:pointer; flex: 1; box-shadow: 0 4px 15px rgba(255,8,68,0.4);">아니오</button>
            </div>
        </div>
    </div>

    <!-- 공습경보 화면 -->
    <div id="air-raid-screen" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(255,0,0,0.9); z-index:10000; flex-direction:column; justify-content:center; align-items:center; color:white; text-align:center;">
        <h1 style="font-size: 80px; color: #fff; font-weight: 900; text-shadow: 0 0 30px #000; animation: shake 0.2s infinite;">공습경보!!!</h1>
    </div>

    <!-- 깜놀 화면 -->
    <div id="jumpscare-screen">
        <img src="깜놀주의.png" alt="깜놀" class="jumpscare-img"
            onerror="this.src='https://via.placeholder.com/800x600/ff0000/ffffff?text=JUMPSCARE'">
    </div>

    <!-- 자물쇠 화면 -->
    <div id="password-screen" class="glass-panel">
        <h2>🔒 PRIVATE PROFILE</h2>
        <p>개인정보를 확인하려면<br>비밀번호를 입력해주세요.</p>
        <input type="password" id="pwd-input" placeholder="****" onkeypress="handleKeyPress(event)" maxlength="8">
        <br>
        <button onclick="checkPassword()">잠금 해제</button>
        <div id="error-msg">비밀번호가 일치하지 않습니다.</div>
    </div>

    <!-- 프로필 상세 화면 -->
    <div id="profile-screen" class="glass-panel">
        <div class="profile-image-container">
            <!-- 사용자님이 업로드하신 사진의 파일명을 image.png 또는 image.jpg 등으로 변경하여 아래 src에 넣어주세요 -->
            <!-- 현재는 기본적으로 보여지도록 설정되어 있습니다 -->
            <img src="profile.png" alt="내 프로필 이미지" class="profile-image" id="user-image"
                onerror="this.src='https://via.placeholder.com/150/2d2d2d/4facfe?text=Image'">
            <canvas id="scratch-canvas" width="160" height="160"></canvas>
        </div>
        <h1>안녕하시긔~!</h1>
        <p class="bio">이곳은 저를 소개하는 프라이빗 프로필 공간입니다. 방문해주셔서 감사합니다.</p>

        <div class="info-grid">
            <div class="info-box">
                <span class="label">이름</span>
                <span class="value">환희</span>
            </div>

            <div class="info-box">
                <span class="label">특징</span>
                <span class="value">엽기적이다</span>
            </div>

            <div class="info-box">
                <span class="label">연락처</span>
                <span class="value">비공개</span>
            </div>

            <div class="info-box">
                <span class="label">좋아하는 게임</span>
                <div class="game-images">
                    <img src="로블.png" alt="로블록스" class="game-img">
                    <img src="다운로드.png" alt="다운로드게임" class="game-img">
                </div>
            </div>
        </div>
        <button class="works-btn" onclick="window.location.href='works.html'">내가 만든 작품 보러가기 🎮</button>
        <button class="study-btn" onclick="window.location.href='study.html'">그외 공부한 것들 📚</button>
    </div>

    <script>
        function checkPassword() {
            const input = document.getElementById('pwd-input').value;
            const errorMsg = document.getElementById('error-msg');
            const pwdScreen = document.getElementById('password-screen');
            const profileScreen = document.getElementById('profile-screen');

            if (input === '0000') {
                // 비번 맞춤 -> 깜놀 액션 시작
                pwdScreen.style.display = 'none';
                errorMsg.style.display = 'none';

                const jumpscare = document.getElementById('jumpscare-screen');
                jumpscare.style.display = 'flex';

                // 깜놀 오디오 재생 (aa.mp3 파일 필요)
                try {
                    const audio = new Audio('aa.mp3');
                    audio.play();
                } catch (e) {
                    console.error('오디오 재생 실패:', e);
                }

                // 3.75초 뒤에 깜놀 화면 없애고 프로필 보여주기
                setTimeout(() => {
                    jumpscare.style.display = 'none';
                    profileScreen.style.display = 'block';

                    setTimeout(() => {
                        profileScreen.style.opacity = '1';
                        profileScreen.style.transform = 'translateY(0)';
                    }, 50);
                }, 3750);
            } else {
                // 실패 시 애니메이션
                errorMsg.style.display = 'block';

                // 애니메이션 리셋 트릭
                errorMsg.style.animation = 'none';
                errorMsg.offsetHeight; /* trigger reflow */
                errorMsg.style.animation = 'shake 0.4s ease-in-out';

                document.getElementById('pwd-input').value = '';
                document.getElementById('pwd-input').focus();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        }

        // 페이지 로드 시 잠금 상태 확인
        let pwdLockInterval;
        window.onload = () => {
            if (sessionStorage.getItem('profileUnlocked') === 'true') {
                document.getElementById('password-screen').style.display = 'none';
                const profileScreen = document.getElementById('profile-screen');
                profileScreen.style.display = 'block';
                profileScreen.style.opacity = '1';
                profileScreen.style.transform = 'translateY(0)';
                document.getElementById('user-image').src = 'profile2.png';
                const canvas = document.getElementById('scratch-canvas');
                if (canvas) canvas.style.display = 'none';
                return;
            }
            checkLockStatus();
            initScratch();
        }

        function checkLockStatus() {
            const lockUntil = localStorage.getItem('pwdLock');
            if (lockUntil) {
                const now = new Date().getTime();
                if (now < lockUntil) {
                    lockUI(lockUntil);
                } else {
                    localStorage.removeItem('pwdLock');
                    document.getElementById('pwd-input').disabled = false;
                    document.getElementById('pwd-input').focus();
                }
            } else {
                document.getElementById('pwd-input').focus();
            }
        }

        function lockUI(lockUntil) {
            const input = document.getElementById('pwd-input');
            input.disabled = true;
            input.value = '';
            
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'block';
            errorMsg.style.color = '#ff9800';

            pwdLockInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = lockUntil - now;

                if (distance <= 0) {
                    clearInterval(pwdLockInterval);
                    localStorage.removeItem('pwdLock');
                    input.disabled = false;
                    errorMsg.style.display = 'none';
                    errorMsg.style.color = '#ff5252';
                    errorMsg.innerText = '비밀번호가 일치하지 않습니다.';
                    input.focus();
                } else {
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    errorMsg.innerText = `잠금 상태: ${minutes}분 ${seconds}초 후 해제`;
                }
            }, 1000);
        }

        function initScratch() {
            const canvas = document.getElementById('scratch-canvas');
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#a0a0a0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = 'bold 20px Noto Sans KR';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('동전으로 긁기!', canvas.width / 2, canvas.height / 2);
            
            let isDrawing = false;
            
            function getMousePos(canvas, evt) {
                const rect = canvas.getBoundingClientRect();
                let clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
                let clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }
            
            function startDrawing(e) {
                isDrawing = true;
                scratch(e);
            }
            
            function stopDrawing() {
                isDrawing = false;
                checkScratchComplete();
            }
            
            function scratch(e) {
                if (!isDrawing) return;
                if (e.cancelable) e.preventDefault();
                
                const pos = getMousePos(canvas, e);
                
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 20, 0, Math.PI * 2);
                ctx.fill();
            }

            let trapTriggered = false;
            const quizQuestions = [];
            for (let i = 1; i <= 14; i++) {
                quizQuestions.push(i + ". 당신은 로봇입니까?");
            }
            quizQuestions.push("15. 당신은 로봇이 아닙니까?");
            let currentQuestionIndex = 0;

            function checkScratchComplete() {
                if (trapTriggered) return;
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = imageData.data;
                let transparentPixels = 0;
                
                for (let i = 3; i < pixels.length; i += 4) {
                    if (pixels[i] === 0) transparentPixels++;
                }
                
                if ((transparentPixels / (pixels.length / 4)) * 100 > 50) {
                    trapTriggered = true;
                    canvas.style.display = 'none';
                    triggerTrapCard();
                }
            }

            function triggerTrapCard() {
                const trapScreen = document.getElementById('trap-screen');
                trapScreen.style.display = 'flex';
                
                setTimeout(() => {
                    document.getElementById('trap-title').style.animation = 'none';
                    document.getElementById('trap-title').style.fontSize = '24px';
                    document.getElementById('trap-title').innerText = "프로필을 보려면 15개의 질문에 답하세요";
                    document.getElementById('trap-title').style.textShadow = 'none';
                    document.getElementById('trap-title').style.color = '#ffffff';
                    document.getElementById('quiz-container').style.display = 'block';
                    showQuestion();
                }, 2500);
            }

            function showQuestion() {
                if (currentQuestionIndex >= 15) {
                    finishQuiz();
                    return;
                }
                document.getElementById('quiz-progress').innerText = `질문 ${currentQuestionIndex + 1} / 15`;
                document.getElementById('quiz-question').innerText = quizQuestions[currentQuestionIndex];
            }

            function failQuiz() {
                const airRaid = document.getElementById('air-raid-screen');
                airRaid.style.display = 'flex';
                
                try {
                    const siren = new Audio('siren.mp3');
                    siren.loop = true;
                    siren.play();
                    
                    setTimeout(() => {
                        siren.pause();
                        triggerLock();
                    }, 5000); // 5초간 사이렌 울린 뒤 잠금
                } catch(e) {
                    setTimeout(triggerLock, 5000);
                }
            }

            function triggerLock() {
                const lockUntil = new Date().getTime() + 5 * 60 * 1000;
                localStorage.setItem('pwdLock', lockUntil);
                window.location.reload(); // 리로드하여 초기 화면 및 잠금 상태로 진입
            }

            function handleAnswer(isYes) {
                if (currentQuestionIndex < 14) {
                    if (isYes) {
                        failQuiz();
                        return;
                    }
                } else {
                    if (!isYes) {
                        failQuiz();
                        return;
                    }
                }
                
                currentQuestionIndex++;
                showQuestion();
            }

            document.getElementById('quiz-btn-yes').addEventListener('click', () => handleAnswer(true));
            document.getElementById('quiz-btn-no').addEventListener('click', () => handleAnswer(false));

            function finishQuiz() {
                document.getElementById('trap-screen').style.display = 'none';
                document.getElementById('user-image').src = 'profile2.png';
                sessionStorage.setItem('profileUnlocked', 'true');
            }
            
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', scratch);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);
            canvas.addEventListener('touchstart', startDrawing, {passive: false});
            canvas.addEventListener('touchmove', scratch, {passive: false});
            canvas.addEventListener('touchend', stopDrawing);
            canvas.addEventListener('touchcancel', stopDrawing);
        }
    </script>
</body>

</html>
